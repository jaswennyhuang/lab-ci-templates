# Reusable: keep a release PR open; merging it tags the service release.
name: release-please
on:
  workflow_call:
    secrets:
      token:
        required: true
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.token }}

# Reusable: build a tagged service release, then put it on staging in the open release branch.
name: release-build
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      platform_repo:
        type: string
        required: true
      # Empty: use the open release/* branch (OneFlow). Set it (e.g. main) for GitHub Flow.
      staging_branch:
        type: string
        required: false
        default: ''
    secrets:
      token:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Get the service code at the tagged commit
      - uses: actions/checkout@v4
      # Tag svc-a-v0.2.0 -> cut off everything up to "-v" -> add "v" -> v0.2.0
      # Saved as this step's output "version" (step id: v)
      - id: v
        run: echo "version=v${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
      # Fake build: a real one runs docker build + push here
      - name: Build
        run: echo "Built image ${{ inputs.service }}:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  update-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Find the open release branch
        id: rb
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          # GitHub Flow: a branch was given, use it
          if [ -n "${{ inputs.staging_branch }}" ]; then echo "branch=${{ inputs.staging_branch }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Newest branch that starts with release/
          b=$(gh api "repos/${{ inputs.platform_repo }}/branches" --paginate -q '.[].name | select(startswith("release/"))' | sort | tail -1)
          # Stop if no release is open
          [ -n "$b" ] || { echo "::error::No open release branch. Run start-release in the platform repo first."; exit 1; }
          echo "branch=$b" >> "$GITHUB_OUTPUT"
      # Get the platform repo at that release branch
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ steps.rb.outputs.branch }}
          token: ${{ secrets.token }}
      - name: Set version on staging
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Replace the tag line, e.g. tag: "v0.2.0"
          sed -i "s/^tag: .*/tag: \"$VERSION\"/" "environments/staging/$SERVICE.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(staging): $SERVICE $VERSION"
          # Push; if another service pushed first, pull and try again (up to 3 times)
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done

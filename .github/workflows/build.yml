# Reusable: build a service, then put its commit SHA on dev in the platform repo.
name: build
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      platform_repo:
        type: string
        required: true
    secrets:
      token:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Built image ${{ inputs.service }}:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  update-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          token: ${{ secrets.token }}
      - name: Set version on dev
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          sha="${GITHUB_SHA::7}"
          sed -i "s/^tag: .*/tag: \"$sha\"/" "environments/dev/$SERVICE.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(dev): $SERVICE $sha"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
